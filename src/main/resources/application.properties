spring.application.name=emergency-med-network
server.port=8080

# Session Configuration (30-minute timeout, cookie security)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/emergency_med_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Deepika@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# File Storage for Prescriptions
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
app.storage.prescription-dir=storage/prescriptions

# Order & Delivery Expiry Settings
app.expiry.request-minutes=15
app.expiry.pickup-hold-minutes=120
app.expiry.delivery-offer-seconds=120

# Payment Module 5 Configuration (Gateway Independent / Demo Mode Enabled)
app.payment.demo-mode=true
app.payment.provider=demo
app.payment.webhook-secret=demo_webhook_secret_key_2026
