<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Medicine Catalogue - EmergencyMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/theme.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom px-4">
  <a class="navbar-brand fw-bold fs-4" href="/"><i class="bi bi-capsule me-2"></i>EmergencyMed Medicine Directory</a>
  <div class="ms-auto d-flex align-items-center gap-3">
    <a href="/chennai-pharmacies.html" class="nav-link"><i class="bi bi-geo-alt me-1"></i> Chennai Discovery</a>
    <a href="/pharmacy/inventory.html" class="nav-link"><i class="bi bi-box-seam me-1"></i> Pharmacy Portal</a>
    <a href="/admin/medicines.html" class="nav-link"><i class="bi bi-shield-lock me-1"></i> Admin Portal</a>
  </div>
</nav>

<div class="container py-5">
  <div class="text-center mb-5" style="max-width: 700px; margin: 0 auto;">
    <h2 class="fw-bold text-navy mb-2">Search Essential Medicines</h2>
    <p class="text-muted">Browse available medicines in approved local pharmacies. Find nearby emergency stock in real-time.</p>
    
    <div class="input-group input-group-lg shadow-sm mt-4">
      <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-teal"></i></span>
      <input type="text" id="public-search-input" class="form-control border-start-0" placeholder="Type brand name or generic formula (e.g. Paracetamol, Metformin)...">
    </div>
  </div>

  <div class="row g-4" id="catalogue-grid">
    <!-- Loaded via JS -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  loadCatalogue();

  const searchInput = document.getElementById('public-search-input');
  let timeout = null;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
      loadCatalogue(e.target.value);
    }, 300);
  });
});

async function loadCatalogue(q = '') {
  const grid = document.getElementById('catalogue-grid');
  grid.innerHTML = '<div class="col-12 text-center p-5"><div class="spinner-border text-teal" role="status"></div></div>';

  try {
    let url = '/medicines?size=50';
    if (q) url += `&q=${encodeURIComponent(q)}`;
    const pageData = await apiRequest(url);
    const list = pageData.content || [];

    if (list.length === 0) {
      grid.innerHTML = '<div class="col-12 text-center p-5 text-muted">No medicines found matching search criteria.</div>';
      return;
    }

    grid.innerHTML = list.map(m => `
      <div class="col-md-4 col-sm-6">
        <div class="card h-100 shadow-sm border-0 rounded-3 card-summary p-3">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge bg-light text-dark">${m.categoryName || 'General'}</span>
            ${m.requiresPrescription ? '<span class="badge-rx">Rx Required</span>' : '<span class="badge bg-success-subtle text-success fw-semibold">OTC</span>'}
          </div>
          <h5 class="fw-bold text-navy mb-1">${m.name}</h5>
          <div class="text-muted small mb-2"><i class="bi bi-activity me-1"></i>Generic: ${m.genericName}</div>
          <div class="small mb-3">
            <span class="fw-semibold">Strength:</span> ${m.strength} | 
            <span class="fw-semibold">Form:</span> ${m.dosageForm}
          </div>
          <div class="small text-muted mb-3"><i class="bi bi-building me-1"></i>${m.manufacturer}</div>
          <div class="mt-auto">
            <a href="/chennai-pharmacies.html" class="btn btn-primary-teal w-100 btn-sm fw-semibold">
              <i class="bi bi-geo-alt me-1"></i> Find Nearby Pharmacies &amp; Emergency Stock
            </a>
          </div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    grid.innerHTML = `<div class="col-12 text-center text-danger p-5">${err.message}</div>`;
  }
}
</script>
</body>
</html>
