<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Partner Registration - Emergency Medicine Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/theme.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div id="main-navbar"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="card-premium p-4 p-md-5 shadow-sm border-0">
          <div class="d-flex align-items-center gap-3 mb-4">
            <a href="/register.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            <div>
              <h2 class="fw-bold mb-0">Delivery Courier Registration</h2>
              <p class="text-muted small mb-0">Join the emergency rapid transit medical courier fleet</p>
            </div>
          </div>

          <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>
          <div id="alert-success" class="alert alert-success d-none" role="alert"></div>

          <form id="delivery-form" class="row g-3">
            <div class="col-12">
              <h6 class="fw-bold text-uppercase text-muted border-bottom pb-2">1. Courier Identity</h6>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Legal Name *</label>
              <input type="text" class="form-control" id="fullName" required placeholder="e.g. Suresh Kannan">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Contact Mobile Phone *</label>
              <input type="tel" class="form-control" id="phone" pattern="^[6-9][0-9]{9}$" required placeholder="9876543218">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Official Email Address *</label>
              <input type="email" class="form-control" id="email" required placeholder="courier@domain.com">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Operating Service City *</label>
              <input type="text" class="form-control" id="city" required value="Chennai">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Password *</label>
              <input type="password" class="form-control" id="password" required placeholder="••••••••">
              <div class="form-text">8-64 chars, upper, lower, number, symbol.</div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm Password *</label>
              <input type="password" class="form-control" id="confirmPassword" required placeholder="Re-enter password">
            </div>

            <div class="col-12 mt-4">
              <h6 class="fw-bold text-uppercase text-muted border-bottom pb-2">2. Vehicle & Driving Credentials</h6>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Vehicle Type</label>
              <select class="form-select" id="vehicleType">
                <option value="Motorcycle">Motorcycle / Bike</option>
                <option value="Scooter">Scooter / Moped</option>
                <option value="Electric Vehicle">Electric Two-Wheeler (EV)</option>
                <option value="Van / Ambulance Support">Van / Cargo Carrier</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Vehicle Registration Number</label>
              <input type="text" class="form-control" id="vehicleNumber" placeholder="TN09AB1234">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Driving Licence Number *</label>
              <input type="text" class="form-control" id="drivingLicenseNo" required placeholder="DL-TN-2020-0012345">
            </div>

            <div class="col-12 mt-4">
              <button type="submit" id="btn-submit" class="btn btn-warning btn-lg w-100 fw-bold text-dark">
                Register Delivery Partner Account
              </button>
            </div>
          </form>

        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth-guard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderNavbar(null);

      const form = document.getElementById('delivery-form');
      const errBox = document.getElementById('alert-error');
      const succBox = document.getElementById('alert-success');
      const submitBtn = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.classList.add('d-none');
        succBox.classList.add('d-none');
        submitBtn.disabled = true;

        const payload = {
          fullName: document.getElementById('fullName').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          password: document.getElementById('password').value,
          confirmPassword: document.getElementById('confirmPassword').value,
          vehicleType: document.getElementById('vehicleType').value,
          vehicleNumber: document.getElementById('vehicleNumber').value.trim() || null,
          drivingLicenseNo: document.getElementById('drivingLicenseNo').value.trim(),
          city: document.getElementById('city').value.trim() || null
        };

        try {
          await Api.post('/api/v1/auth/register/delivery-partner', payload);
          succBox.textContent = 'Delivery Partner registered! Redirecting to login...';
          succBox.classList.remove('d-none');
          setTimeout(() => window.location.href = '/login.html', 1200);
        } catch (err) {
          errBox.textContent = err.message;
          errBox.classList.remove('d-none');
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
