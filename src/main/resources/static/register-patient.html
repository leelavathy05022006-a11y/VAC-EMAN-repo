<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration - Emergency Medicine Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/theme.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div id="main-navbar"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="card-premium p-4 p-md-5 shadow-sm border-0">
          <div class="d-flex align-items-center gap-3 mb-4">
            <a href="/register.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            <div>
              <h2 class="fw-bold mb-0">Patient Account Registration</h2>
              <p class="text-muted small mb-0">Create your personal emergency healthcare profile</p>
            </div>
          </div>

          <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>
          <div id="alert-success" class="alert alert-success d-none" role="alert"></div>

          <form id="patient-form" class="row g-3">
            <!-- Account Credentials -->
            <div class="col-12">
              <h6 class="fw-bold text-uppercase text-muted border-bottom pb-2">1. Account Credentials</h6>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name *</label>
              <input type="text" class="form-control" id="fullName" required placeholder="e.g. Ramesh Kumar">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address *</label>
              <input type="email" class="form-control" id="email" required placeholder="name@example.com">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Mobile Phone (10 digits) *</label>
              <input type="tel" class="form-control" id="phone" pattern="^[6-9][0-9]{9}$" required placeholder="9876543210">
              <div class="form-text">Must be a valid 10-digit Indian phone number</div>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-semibold">Date of Birth</label>
              <input type="date" class="form-control" id="dateOfBirth">
            </div>

            <div class="col-md-3">
              <label class="form-label fw-semibold">Blood Group</label>
              <select class="form-select" id="bloodGroup">
                <option value="">Select</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Password *</label>
              <input type="password" class="form-control" id="password" required placeholder="At least 8 chars, Upper, Lower, Number, Special">
              <div class="form-text">8-64 chars with uppercase, lowercase, digit, and symbol.</div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm Password *</label>
              <input type="password" class="form-control" id="confirmPassword" required placeholder="Re-enter password">
            </div>

            <!-- Location Details -->
            <div class="col-12 mt-4">
              <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                <h6 class="fw-bold text-uppercase text-muted mb-0">2. Saved Location</h6>
                <button type="button" class="btn btn-outline-teal btn-sm" id="btn-geo">
                  <i class="bi bi-geo-alt-fill text-danger me-1"></i> Use My Current Location
                </button>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Street Address</label>
              <input type="text" class="form-control" id="address" placeholder="Flat / House No, Street name">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">City</label>
              <input type="text" class="form-control" id="city" value="Chennai">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Pincode (6 digits)</label>
              <input type="text" class="form-control" id="pincode" pattern="^[0-9]{6}$" placeholder="600020">
            </div>

            <div class="col-md-2">
              <label class="form-label fw-semibold">Latitude</label>
              <input type="number" step="any" class="form-control" id="latitude" placeholder="13.0033">
            </div>

            <div class="col-md-2">
              <label class="form-label fw-semibold">Longitude</label>
              <input type="number" step="any" class="form-control" id="longitude" placeholder="80.2550">
            </div>

            <!-- Emergency Contact -->
            <div class="col-12 mt-4">
              <h6 class="fw-bold text-uppercase text-muted border-bottom pb-2">3. Emergency Contact (Optional)</h6>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Contact Person Name</label>
              <input type="text" class="form-control" id="emergencyContactName" placeholder="Next of Kin / Relative">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Emergency Phone</label>
              <input type="tel" class="form-control" id="emergencyContactPhone" pattern="^[6-9][0-9]{9}$" placeholder="9876543290">
            </div>

            <div class="col-12 mt-4">
              <button type="submit" id="btn-submit" class="btn btn-primary btn-lg w-100 fw-bold">
                <span id="submit-text">Complete Patient Registration</span>
                <span id="submit-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
              </button>
            </div>
          </form>

        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth-guard.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderNavbar(null);

      // Geolocation
      document.getElementById('btn-geo').addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert('Geolocation is not supported by your browser.');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            document.getElementById('latitude').value = pos.coords.latitude.toFixed(6);
            document.getElementById('longitude').value = pos.coords.longitude.toFixed(6);
            UI.showToast('Location coordinates captured!', 'success');
          },
          (err) => {
            // Default to Chennai Adyar if blocked
            document.getElementById('latitude').value = "13.003300";
            document.getElementById('longitude').value = "80.255000";
            UI.showToast('Using default coordinates (Chennai Adyar)', 'info');
          }
        );
      });

      // Submit
      const form = document.getElementById('patient-form');
      const errBox = document.getElementById('alert-error');
      const succBox = document.getElementById('alert-success');
      const submitBtn = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.classList.add('d-none');
        succBox.classList.add('d-none');
        submitBtn.disabled = true;

        const payload = {
          fullName: document.getElementById('fullName').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          dateOfBirth: document.getElementById('dateOfBirth').value || null,
          bloodGroup: document.getElementById('bloodGroup').value || null,
          password: document.getElementById('password').value,
          confirmPassword: document.getElementById('confirmPassword').value,
          address: document.getElementById('address').value.trim() || null,
          city: document.getElementById('city').value.trim() || null,
          pincode: document.getElementById('pincode').value.trim() || null,
          latitude: document.getElementById('latitude').value ? parseFloat(document.getElementById('latitude').value) : null,
          longitude: document.getElementById('longitude').value ? parseFloat(document.getElementById('longitude').value) : null,
          emergencyContactName: document.getElementById('emergencyContactName').value.trim() || null,
          emergencyContactPhone: document.getElementById('emergencyContactPhone').value.trim() || null
        };

        try {
          await Api.post('/api/v1/auth/register/patient', payload);
          succBox.textContent = 'Account created successfully! Redirecting to login...';
          succBox.classList.remove('d-none');
          setTimeout(() => window.location.href = '/login.html', 1200);
        } catch (err) {
          errBox.textContent = err.message;
          errBox.classList.remove('d-none');
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
