spring.application.name=emergency-med-network-test
server.port=0

spring.datasource.url=jdbc:h2:mem:emergency_med_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.storage.prescription-dir=target/test-storage/prescriptions
app.expiry.request-minutes=15
app.expiry.pickup-hold-minutes=120
app.expiry.delivery-offer-seconds=120
app.payment.demo-mode=true
app.payment.provider=demo
app.payment.webhook-secret=test_webhook_secret
